<!DOCTYPE html>
<html class="dark" lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Echi di Gloria - CCG Tattico</title>
  
  <!-- Font Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configurazione Tema -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#17130f",
            "surface-container-lowest": "#110d0a",
            "surface-container-low": "#1f1b17",
            "surface-container": "#231f1b",
            "surface-container-high": "#2e2925",
            "surface-container-highest": "#393430",
            primary: "#f2ca50",
            "primary-fixed-dim": "#e9c349",
            secondary: "#bdf4ff",
            tertiary: "#ffbebe",
            error: "#ffb4ab",
            "error-container": "#93000a",
            "on-surface": "#ebe0db",
            "on-surface-variant": "#d0c5af",
            "outline-variant": "#4d4635"
          },
          fontFamily: {
            display: ["Cinzel Decorative", "serif"],
            body: ["Cinzel", "serif"],
            tactical: ["Space Grotesk", "sans-serif"]
          }
        }
      }
    };
  </script>
  
  <style>
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    /* Previene lo scrolling elastico nativo (bounce) dell'intera pagina su iOS */
    body { overscroll-behavior: none; }
  </style>
</head>
<!-- FIX QUI: h-[100dvh] blocca la pagina alla viewport esatta, permettendo al main di scrollare -->
<body class="bg-surface font-body text-on-surface antialiased flex flex-col h-[100dvh] select-none overflow-hidden">
  
  <header class="fixed top-0 left-0 w-full z-50 h-16 bg-surface-container-lowest/90 backdrop-blur-md border-b border-surface-container-high pointer-events-none">
    <div class="max-w-md md:max-w-2xl lg:max-w-4xl mx-auto w-full h-full flex items-center justify-between px-4 pointer-events-auto">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-2xl">shield</span>
        <span class="font-display font-bold text-primary tracking-wide">Echi di Gloria</span>
      </div>
      <div class="flex items-center gap-3 font-tactical text-xs">
        <div class="flex items-center gap-1 bg-surface-container px-2 py-1 rounded">
          <span class="material-symbols-outlined text-primary text-sm">monetization_on</span>
          <span id="silverCount">--</span>
        </div>
        <div class="flex items-center gap-1 bg-surface-container px-2 py-1 rounded">
          <span class="material-symbols-outlined text-secondary text-sm">diamond</span>
          <span id="gemsCount">--</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Il main ora ha overflow-y-auto e riempie lo spazio rimanente, attivando lo scroll nativo -->
  <main id="appRoot" class="flex-1 pt-16 pb-20 overflow-y-auto max-w-md md:max-w-2xl lg:max-w-4xl mx-auto w-full relative border-x border-surface-container-high/30 bg-surface/50 scroll-smooth"></main>

  <nav class="fixed bottom-0 left-0 w-full h-16 z-50 bg-surface-container-lowest/95 backdrop-blur-md border-t border-surface-container-high pointer-events-none">
    <div class="max-w-md md:max-w-2xl lg:max-w-4xl mx-auto w-full h-full flex items-center justify-around pointer-events-auto font-tactical text-[10px] md:text-xs">
      <button onclick="navigate('arena')" class="nav-btn flex flex-col items-center text-primary transition-colors" data-view="arena">
        <span class="material-symbols-outlined mb-1 text-[22px]">swords</span>
        <span>Arena</span>
      </button>
      <button onclick="navigate('campaign')" class="nav-btn flex flex-col items-center text-on-surface-variant hover:text-on-surface transition-colors" data-view="campaign">
        <span class="material-symbols-outlined mb-1 text-[22px]">auto_stories</span>
        <span>Campagna</span>
      </button>
      <button onclick="navigate('collection')" class="nav-btn flex flex-col items-center text-on-surface-variant hover:text-on-surface transition-colors" data-view="collection">
        <span class="material-symbols-outlined mb-1 text-[22px]">style</span>
        <span>Collezione</span>
      </button>
      <button onclick="navigate('shop')" class="nav-btn flex flex-col items-center text-on-surface-variant hover:text-on-surface transition-colors" data-view="shop">
        <span class="material-symbols-outlined mb-1 text-[22px]">storefront</span>
        <span>Negozio</span>
      </button>
    </div>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
